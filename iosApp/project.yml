name: Generosity
options:
  bundleIdPrefix: org.generosity
  deploymentTarget:
    iOS: "16.0"
  knownRegions: [en, es]
configs:
  Debug: debug
  Release: release
  Preview: debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
  SharedBridge:
    path: SharedBridge
targets:
  Generosity:
    type: application
    platform: iOS
    sources:
      - path: GenerosityApp
        excludes: [Info.plist, GoogleService-Info.plist, GoogleService-Info.preview.plist]
    dependencies:
      - package: SharedBridge
      - package: Firebase
        product: FirebaseMessaging
    preBuildScripts:
      - name: Check design resources
        script: python3 "$SRCROOT/../scripts/generate-design-system.py" --check
        basedOnDependencyAnalysis: false
      - name: Check environment isolation
        script: python3 "$SRCROOT/../scripts/check-mobile-environment.py"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy optional Firebase configuration
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$SRCROOT/$GENEROSITY_FIREBASE_PLIST_FILE" ]; then
            cp "$SRCROOT/$GENEROSITY_FIREBASE_PLIST_FILE" "$destination"
          else
            rm -f "$destination"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app
        GENEROSITY_API_URL: https://api.generosity.global
        GENEROSITY_CHANNEL: production
        GENEROSITY_AUTH_CLIENT: ios
        GENEROSITY_AUTH_SCHEME: org.generosity.app.ios
        GENEROSITY_FIREBASE_PLIST_FILE: GenerosityApp/GoogleService-Info.plist
        PRODUCT_MODULE_NAME: Generosity
        INFOPLIST_KEY_CFBundleDisplayName: Generosity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GenerosityApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENEROSITY_PUSH_ENABLED: NO
      configs:
        Preview:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconPreview
          PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app.preview
          INFOPLIST_KEY_CFBundleDisplayName: Generosity Pruebas
          GENEROSITY_API_URL: https://api-preview.generosity.global
          GENEROSITY_CHANNEL: preview
          GENEROSITY_AUTH_CLIENT: ios-preview
          GENEROSITY_AUTH_SCHEME: org.generosity.app.preview.ios
          GENEROSITY_FIREBASE_PLIST_FILE: GenerosityApp/GoogleService-Info.preview.plist
  GenerosityLocalizationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GenerosityLocalizationTests]
    dependencies:
      - target: Generosity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app.localizationtests
        GENERATE_INFOPLIST_FILE: YES
  GenerosityUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [GenerosityAppTests]
    dependencies:
      - target: Generosity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Generosity
      configs:
        Preview:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PREVIEW_APP_TESTS"
schemes:
  Generosity:
    build:
      targets:
        Generosity: all
        GenerosityLocalizationTests: [test]
        GenerosityUITests: [test]
    test:
      targets:
        - GenerosityLocalizationTests
        - GenerosityUITests

  GenerosityPreview:
    build:
      targets:
        Generosity: all
    run:
      config: Preview
    archive:
      config: Preview
