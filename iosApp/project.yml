name: Generosity
options:
  bundleIdPrefix: org.generosity
  deploymentTarget:
    iOS: "16.0"
  knownRegions: [en, es]
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
  SharedBridge:
    path: SharedBridge
targets:
  Generosity:
    type: application
    platform: iOS
    sources:
      - path: GenerosityApp
        excludes: [Info.plist, GoogleService-Info.plist]
    dependencies:
      - package: SharedBridge
      - package: Firebase
        product: FirebaseMessaging
    preBuildScripts:
      - name: Check design resources
        script: python3 "$SRCROOT/../scripts/generate-design-system.py" --check
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy optional Firebase configuration
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$SRCROOT/GenerosityApp/GoogleService-Info.plist" ]; then
            cp "$SRCROOT/GenerosityApp/GoogleService-Info.plist" "$destination"
          else
            rm -f "$destination"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app
        GENEROSITY_API_URL: https://api.generosity.global
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GenerosityApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENEROSITY_PUSH_ENABLED: NO
  GenerosityLocalizationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GenerosityLocalizationTests]
    dependencies:
      - target: Generosity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app.localizationtests
        GENERATE_INFOPLIST_FILE: YES
  GenerosityUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [GenerosityAppTests]
    dependencies:
      - target: Generosity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.generosity.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Generosity
schemes:
  Generosity:
    build:
      targets:
        Generosity: all
        GenerosityLocalizationTests: [test]
        GenerosityUITests: [test]
    test:
      targets:
        - GenerosityLocalizationTests
        - GenerosityUITests
