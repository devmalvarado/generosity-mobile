name: Publish portal

on:
  push:
    branches: [main]
    paths:
      - portal/index.html
      - portal/styles.css
      - portal/portal.js
      - portal/assets/**
      - design/**
      - .github/workflows/publish-portal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated design resources
        run: python3 scripts/generate-design-system.py --check

      - name: Wait for the account and location-intake API release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            intake=$(curl --silent --show-error --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' https://api.generosity.global/api/v1/me/center-applications || true)
            reset=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 'https://api.generosity.global/reset-password/release-check?email=probe%40example.invalid&locale=es' || true)
            legal=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 'https://api.generosity.global/legal/privacy?locale=es' || true)
            if [ "$intake" = "401" ] && printf '%s' "$reset" | grep -q 'Nueva contraseña' && printf '%s' "$legal" | grep -q '2026-11-01'; then
              exit 0
            fi
            sleep 10
          done
          echo 'API prerequisite missing; portal files were not uploaded. Publish the API first, then rerun this workflow.'
          exit 1

      - name: Stage public portal files
        run: |
          set -eu
          mkdir -p publish/assets
          cp portal/index.html portal/styles.css portal/portal.js publish/
          cp portal/assets/apple-touch-icon.png portal/assets/favicon.png portal/assets/logo.png publish/assets/
          cp portal/assets/design-tokens.css publish/assets/
          find publish -type f | sort > /tmp/staged.txt
          cat /tmp/staged.txt
          cat > /tmp/expected.txt << 'LIST'
          publish/assets/apple-touch-icon.png
          publish/assets/design-tokens.css
          publish/assets/favicon.png
          publish/assets/logo.png
          publish/index.html
          publish/portal.js
          publish/styles.css
          LIST
          diff -u /tmp/expected.txt /tmp/staged.txt

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PORTAL_FTP_SERVER }}
          username: ${{ secrets.PORTAL_FTP_USERNAME }}
          password: ${{ secrets.PORTAL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The saved server is an IP. Its certificate is for *.hstgr.io, so name checks cannot pass.
          security: loose
          local-dir: ./publish/
          # This FTP account is already rooted at the portal public_html.
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
