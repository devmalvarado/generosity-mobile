name: Publish portal

on:
  push:
    branches: [main]
    tags: ['portal-release-*']
    paths:
      - portal/index.html
      - portal/styles.css
      - portal/portal.js
      - portal/assets/**
      - portal/ayudar/**
      - portal/registrar-sede/**
      - portal/kindness-center/**
      - portal/app/**
      - portal/public-files.txt
      - design/**
      - .github/workflows/publish-portal.yml
      - .github/scripts/publish_privacy.py
      - backend/resources/legal/privacy.*.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-portal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated design resources
        run: python3 scripts/generate-design-system.py --check

      - name: Check selective privacy publication
        run: python3 .github/scripts/test_publish_privacy.py

      - name: Publish map privacy and verify portal CORS support
        env:
          API_FTP_SERVER: ${{ secrets.API_FTP_SERVER }}
          API_FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          API_FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: python3 .github/scripts/publish_privacy.py

      - name: Wait for the account and location-intake API release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            intake=$(curl --silent --show-error --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' https://api.generosity.global/api/v1/me/center-applications || true)
            reset=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 'https://api.generosity.global/reset-password/release-check?email=probe%40example.invalid&locale=es' || true)
            legal=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 'https://api.generosity.global/legal/privacy?locale=es' || true)
            if [ "$intake" = "401" ] && printf '%s' "$reset" | grep -q 'Nueva contraseña' && printf '%s' "$legal" | grep -q 'OpenStreetMap'; then
              exit 0
            fi
            sleep 10
          done
          echo 'API prerequisite missing; portal files were not uploaded. Publish the API first, then rerun this workflow.'
          exit 1

      - name: Stage public portal files
        run: |
          set -eu
          while IFS= read -r file; do
            mkdir -p "publish/$(dirname "$file")"
            cp "portal/$file" "publish/$file"
          done < portal/public-files.txt
          find publish -type f | sort

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PORTAL_FTP_SERVER }}
          username: ${{ secrets.PORTAL_FTP_USERNAME }}
          password: ${{ secrets.PORTAL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The saved server is an IP. Its certificate is for *.hstgr.io, so name checks cannot pass.
          security: loose
          local-dir: ./publish/
          # This FTP account is already rooted at the portal public_html.
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify published files at the origin
        env:
          PORTAL_FTP_SERVER: ${{ secrets.PORTAL_FTP_SERVER }}
          PORTAL_FTP_USERNAME: ${{ secrets.PORTAL_FTP_USERNAME }}
          PORTAL_FTP_PASSWORD: ${{ secrets.PORTAL_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from publish_api import connect, require_env
          files = Path('portal/public-files.txt').read_text().splitlines()
          with connect(require_env('PORTAL_FTP_SERVER'), require_env('PORTAL_FTP_USERNAME'), require_env('PORTAL_FTP_PASSWORD')) as ftp:
              for name in files:
                  received = io.BytesIO()
                  ftp.retrbinary('RETR /' + name, received.write)
                  if received.getvalue() != (Path('portal') / name).read_bytes():
                      raise SystemExit('Published bytes differ: ' + name)
          print(f'Origin matches all {len(files)} public files; CDN transformations are separate.')
          PY
